# Optional local AI services. omabook works without them — the reader, library,
# and import pipeline have no dependency on either (SPEC §6.2).
#
#   docker compose up -d kokoro     # text to speech
#   docker compose up -d ollama     # summaries, tagging, embeddings (Phase 6)

services:
  # Text to speech. ~5.4 GB image, but the model and all 68 voices are baked
  # in, so there is no volume and no first-run download.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: omabook_kokoro
    restart: unless-stopped
    ports:
      - "${KOKORO_PORT:-8880}:8880"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8880/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Chat and embeddings. Prefer running Ollama natively (the binary is already
  # at /usr/bin/ollama); this is here for machines without it.
  ollama:
    image: ollama/ollama:latest
    container_name: omabook_ollama
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      # Unload models when idle rather than holding gigabytes indefinitely.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}

volumes:
  ollama_data:
